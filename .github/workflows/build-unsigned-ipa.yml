name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: Desktop/NeteaseMusic-iOS
        run: xcodegen generate

      - name: Build Unsigned App
        working-directory: Desktop/NeteaseMusic-iOS
        run: |
          set -o pipefail
          xcodebuild build \
            -project NeteaseMusic.xcodeproj \
            -scheme NeteaseMusic \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build.log
          echo ""
          echo "===== BUILD RESULT ====="
          if grep -q "BUILD SUCCEEDED" build.log; then
            echo "BUILD SUCCEEDED"
          else
            echo "BUILD FAILED"
            echo ""
            echo "===== ERROR SUMMARY ====="
            grep -E "^[^/]*error:" build.log | head -20 || true
            exit 1
          fi

      - name: Package Unsigned IPA
        working-directory: Desktop/NeteaseMusic-iOS
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/NeteaseMusic.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r build/NeteaseMusic-unsigned.ipa Payload
          ls -lh build/NeteaseMusic-unsigned.ipa

      - name: Upload IPA to FILEBIN
        working-directory: Desktop/NeteaseMusic-iOS
        run: |
          IPA_FILE="build/NeteaseMusic-unsigned.ipa"
          FILENAME="NeteaseMusic-unsigned-${{ github.run_number }}.ipa"
          echo "Uploading $FILENAME to FILEBIN..."
          curl -s -X POST \
            --data-binary @"$IPA_FILE" \
            "https://filebin.net/neteasemusic-ios/$FILENAME" \
            -H "Content-Type: application/octet-stream" \
            | tee filebin-response.json
          echo ""
          echo "Download URL: https://filebin.net/neteasemusic-ios/$FILENAME"

      - name: Upload IPA as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeteaseMusic-unsigned-ipa
          path: Desktop/NeteaseMusic-iOS/build/NeteaseMusic-unsigned.ipa

      - name: Print Download Link
        run: |
          FILENAME="NeteaseMusic-unsigned-${{ github.run_number }}.ipa"
          echo ""
          echo "=================================================="
          echo "FILEBIN 下载链接："
          echo "https://filebin.net/neteasemusic-ios/$FILENAME"
          echo "=================================================="