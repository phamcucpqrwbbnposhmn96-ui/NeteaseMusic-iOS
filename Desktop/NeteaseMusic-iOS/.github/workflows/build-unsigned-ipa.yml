name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned Archive
        run: |
          xcodebuild archive \
            -project NeteaseMusic.xcodeproj \
            -scheme NeteaseMusic \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/NeteaseMusic.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          APP_PATH="build/NeteaseMusic.xcarchive/Products/Applications/NeteaseMusic.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r build/NeteaseMusic-unsigned.ipa Payload
          ls -lh build/NeteaseMusic-unsigned.ipa

      - name: Upload IPA to FILEBIN
        run: |
          IPA_FILE="build/NeteaseMusic-unsigned.ipa"
          FILENAME="NeteaseMusic-unsigned-${{ github.run_number }}.ipa"
          echo "Uploading $FILENAME to FILEBIN..."
          curl -s -X POST \
            --data-binary @"$IPA_FILE" \
            "https://filebin.net/neteasemusic-ios/$FILENAME" \
            -H "Content-Type: application/octet-stream" \
            | tee filebin-response.json
          echo ""
          echo "Download URL: https://filebin.net/neteasemusic-ios/$FILENAME"

      - name: Upload IPA as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeteaseMusic-unsigned-ipa
          path: build/NeteaseMusic-unsigned.ipa

      - name: Print Download Link
        run: |
          FILENAME="NeteaseMusic-unsigned-${{ github.run_number }}.ipa"
          echo ""
          echo "=================================================="
          echo "FILEBIN 下载链接："
          echo "https://filebin.net/neteasemusic-ios/$FILENAME"
          echo "=================================================="
